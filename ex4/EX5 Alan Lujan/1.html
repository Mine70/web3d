<html>

<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
</head>

<body>
    <a-scene cursor="rayOrigin: mouse">
        <a-assets>
            <img id="bosque" src="bosque.jpg" />
            <img id="carretera" src="carretera.png" />
            <img id="asgore" src="asgore.png" />
            <img id="rudy" src="rudy.png" />
            <img id="cara" src="6.jpg" />
            <img id="bicicletes" src="7.jpg" />
            <img id="bicicletes1" src="texturaterra.jpg" />
          

        </a-assets>
        <a-sky src="#bosque"></a-sky>
        <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" src="#carretera"></a-plane>
        <a-box position="0 1 -44" rotation="90 0 0" scale="2.8 1.3 2.3" src="#asgore"
        animation="property: position; to: 0 1 50; dur: 10000; dir: alternate; loop: true"></a-box>>
        <a-box position="0 1 -38" rotation="90 0 0" scale="1 1 2.8" src="#rudy"
            animation="property: position; to: 0 1 50; dur: 10000; dir: alternate; loop: true"></a-box>>

        <a-box position="-4 0 0" rotation="0 0 50" src="#cara" depth="1" height="1" width="1"
            animation="property: rotation; to: 0 360 0; dur: 5000; loop: true"></a-box>
        <a-dodecahedron id="esmou" position="8 2 -6" rotation="0 30 0" radius="3" src="#bicicletes">
        </a-dodecahedron>
        <a-dodecahedron id="esmou1" position="-8 1 6" rotation="0 30 0" radius="3" src="#bicicletes1">
        </a-dodecahedron>
    </a-scene>

    <script>
        let unobjecte = document.querySelector("#esmou");

        unobjecte.addEventListener("click", () => {
            unobjecte.setAttribute("animation", {
                property: "position",
                to: "8 40 -6",
                dur: 10000
            });
        });
    </script>
    <script>
        let unobjecte1 = document.querySelector("#esmou1");

        unobjecte1.addEventListener("click", () => {
            unobjecte1.setAttribute("animation", {
                property: "position",
                to: "8 40 -6",
                dur: 10000
            });
        });
    </script>
</body>

</html>
